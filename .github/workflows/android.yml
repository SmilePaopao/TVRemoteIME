name: Android CI

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Install Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip
        unzip commandlinetools-linux-7583922_latest.zip -d $HOME/sdk
        yes | $HOME/sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/sdk "build-tools;27.0.3"
      env:
        JAVA_HOME: /opt/hostedtoolcache/Java_Adopt_jdk/11.0.26-4/x64
        ANDROID_HOME: $HOME/sdk

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon
      env:
        JAVA_HOME: /opt/hostedtoolcache/Java_Adopt_jdk/11.0.26-4/x64
        ANDROID_HOME: $HOME/sdk

    - name: Upload APK to GitHub Releases
      uses: ncipollo/release-action@v1
      with:
        artifacts: app/build/outputs/apk/debug/app-debug.apk
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.ref }}
        name: Release ${{ github.ref }}
        body: |
          Automated release from GitHub Actions.